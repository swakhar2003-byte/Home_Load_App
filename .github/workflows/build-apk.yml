name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap add android
      - name: Add permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in USE_EXACT_ALARM SCHEDULE_EXACT_ALARM POST_NOTIFICATIONS RECEIVE_BOOT_COMPLETED; do
            grep -q "android.permission.$p" $M || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>#" $M
          done
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: home-energy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
